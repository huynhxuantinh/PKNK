x-django-environment: &django_environment
  DB_HOST: db
  DB_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  REDIS_CACHE_URL: redis://redis:6379/2
  DRF_NUM_PROXIES: "1"
  GIS_BIN_DIR: ""
  GDAL_LIBRARY_PATH: ""
  GEOS_LIBRARY_PATH: ""
  USE_S3_STORAGE: "true"
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_STORAGE_BUCKET_NAME: ${MINIO_BUCKET}
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_REGION_NAME: us-east-1

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  storage-init:
    build:
      context: .
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *django_environment
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app/backend
    command: ["python", "manage.py", "ensure_clinical_bucket"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *django_environment
      RUN_MIGRATIONS: "true"
    volumes:
      - ./backend:/app/backend
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *django_environment
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app/backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  beat:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      <<: *django_environment
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app/backend
      - celerybeat_data:/var/lib/celery
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  frontend:
    image: node:24-alpine
    restart: unless-stopped
    init: true
    working_dir: /app
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://web:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  celerybeat_data:
  frontend_node_modules:

networks:
  backend:
    driver: bridge
