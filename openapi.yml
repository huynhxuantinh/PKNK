  /api/v1/branches/:
    get:
      operationId: branch_list
      parameters:
      - in: query
        name: dentist_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: latitude
        schema:
          type: number
          format: double
          maximum: 90
          minimum: -90
      - in: query
        name: longitude
        schema:
          type: number
          format: double
          maximum: 180
          minimum: -180
      - in: query
        name: open_now
        schema:
          type: boolean
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: province_code
        schema:
          type: string
          maxLength: 20
          minLength: 1
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 100
          minimum: 0.1
      - in: query
        name: service_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: ward_code
        schema:
          type: string
          maxLength: 20
          minLength: 1
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
