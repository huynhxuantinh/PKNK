components:
  schemas:
    AccessTypeEnum:
      enum:
      - READ
      - WRITE
      type: string
      description: |-
        * `READ` - Đọc
        * `WRITE` - Thay đổi
    Appointment:
      type: object
      properties:
        public_code:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AppointmentStatusEnum'
          readOnly: true
        id_branch:
          type: integer
          readOnly: true
        id_branch_service:
          type: integer
          readOnly: true
        id_dentist:
          type: integer
          readOnly: true
        dentist_name:
          type: string
          readOnly: true
        id_chair:
          type: integer
          readOnly: true
        chair_name:
          type: string
          readOnly: true
        service_name_snapshot:
          type: string
          readOnly: true
        duration_minutes:
          type: integer
          readOnly: true
        buffer_minutes:
          type: integer
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - buffer_minutes
      - chair_name
      - confirmed_at
      - created_at
      - dentist_name
      - duration_minutes
      - ends_at
      - expires_at
      - id_branch
      - id_branch_service
      - id_chair
      - id_dentist
      - public_code
      - service_name_snapshot
      - starts_at
      - status
    AppointmentBranchRow:
      type: object
      properties:
        branch_id:
          type: integer
        branch_name:
          type: string
        total_appointments:
          type: integer
        completed_count:
          type: integer
        cancelled_count:
          type: integer
        no_show_count:
          type: integer
        cancellation_rate_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        no_show_rate_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - branch_id
      - branch_name
      - cancellation_rate_percent
      - cancelled_count
      - completed_count
      - no_show_count
      - no_show_rate_percent
      - total_appointments
    AppointmentHoldCreate:
      type: object
      properties:
        branch_service_id:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
        dentist_id:
          type: integer
          minimum: 1
      required:
      - branch_service_id
      - starts_at
    AppointmentReport:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        timezone:
          type: string
        total_appointments:
          type: integer
        completed_count:
          type: integer
        cancelled_count:
          type: integer
        no_show_count:
          type: integer
        cancellation_rate_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        no_show_rate_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        by_branch:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentBranchRow'
      required:
      - by_branch
      - cancellation_rate_percent
      - cancelled_count
      - completed_count
      - date_from
      - date_to
      - no_show_count
      - no_show_rate_percent
      - scope
      - timezone
      - total_appointments
    AppointmentStatusEnum:
      enum:
      - HELD
      - PENDING
      - CONFIRMED
      - CHECKED_IN
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      - NO_SHOW
      - EXPIRED
      type: string
      description: |-
        * `HELD` - Giữ chỗ
        * `PENDING` - Chờ xác nhận
        * `CONFIRMED` - Đã xác nhận
        * `CHECKED_IN` - Đã check-in
        * `IN_PROGRESS` - Đang khám
        * `COMPLETED` - Hoàn thành
        * `CANCELLED` - Đã hủy
        * `NO_SHOW` - Không đến
        * `EXPIRED` - Hết thời gian giữ chỗ
    AuditEvent:
      type: object
      properties:
        id_audit_event:
          type: integer
          readOnly: true
        actor_user_id:
          type: integer
          readOnly: true
        actor_email:
          type: string
          format: email
          readOnly: true
        organization_id:
          type: integer
          readOnly: true
        branch_id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 100
        resource_type:
          type: string
          maxLength: 100
        resource_id:
          type: string
          nullable: true
          maxLength: 128
        access_type:
          $ref: '#/components/schemas/AccessTypeEnum'
        before_data: {}
        after_data: {}
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          maxLength: 500
        request_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - access_type
      - action
      - actor_email
      - actor_user_id
      - branch_id
      - created_at
      - id_audit_event
      - organization_id
      - resource_type
    AuthPayload:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        tokens:
          allOf:
          - $ref: '#/components/schemas/TokenPair'
          readOnly: true
      required:
      - tokens
      - user
    AuthResponse:
      type: object
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/AuthPayload'
          readOnly: true
      required:
      - data
    BlankEnum:
      enum:
      - ''
    BranchDentist:
      type: object
